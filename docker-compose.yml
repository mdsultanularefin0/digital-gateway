services:
  giftcardvibe:
    container_name: giftcardvibe
    image: giftcardvibe:latest
    restart: unless-stopped
    
    # Network configuration for Nginx Proxy Manager
    networks:
      - webnet
      
    # Internal port for NPM to reach
    expose:
      - "80"

    # Production resource limits for your i7-5500U LXC
    deploy:
      resources:
        limits:
          memory: 512M

    # Log management to prevent filling up your LXC disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"


networks:
  webnet:
    external: true  # Uses the shared network created in Step 1