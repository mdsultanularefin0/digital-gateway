server {
    listen 80;
    server_name localhost;

    # --- PERFORMANCE: GZIP ---
    # Reduces JS size by ~70% for faster loading in BD [cite: 63]
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # --- LOGGING: CLEAN & FOCUSED ---
    # Send logs to stdout so they appear in Portainer/Docker logs 
    access_log /dev/stdout combined;
    error_log /dev/stderr;

    root /usr/share/nginx/html;
    index index.html;

    # --- SECURITY HEADERS ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- ASSETS: CACHE & SILENT LOGS ---
    # This prevents your Docker logs from being flooded with .js/.css files [cite: 77]
    location /assets/ {
        access_log off; 
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SOCIAL CRAWLER SSR META ---
    # Detects link-preview crawlers (Facebook, WhatsApp, Twitter/X, LinkedIn,
    # Slack, Discord, Telegram, iMessage, Skype, Pinterest) and proxies them
    # to the og-meta edge function so they see per-route <title>/og:*/twitter:*
    # tags. Real users and Googlebot fall through to the SPA below.
    set $is_social_crawler 0;
    if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Slack-ImgProxy|Discordbot|TelegramBot|WhatsApp|SkypeUriPreview|Pinterest|redditbot|Applebot|vkShare|W3C_Validator|Iframely|Embedly|Snapchat)") {
        set $is_social_crawler 1;
    }

    # --- SPA ROUTING ---
    # Ensures /admin, /products, etc. don't 404 on refresh [cite: 102]
    location / {
        if ($is_social_crawler = 1) {
            # NOTE: replace <PROJECT_REF> with your Supabase project ref before deploy.
            rewrite ^ /__og_meta$uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Internal proxy target for social crawlers.
    location /__og_meta {
        internal;
        # Strip the /__og_meta prefix and forward the original path as ?path=
        set $og_path $request_uri;
        if ($og_path ~ ^/__og_meta(/.*)$) {
            set $og_path $1;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass https://<PROJECT_REF>.supabase.co/functions/v1/og-meta?path=$og_path;
    }

    # --- OPTIONAL: NAVIGATION PING ---
    # If you use the 'LogNavigation' React hook mentioned before, 
    # this will capture every page click in your Docker logs.
    location /api/log {
        access_log /dev/stdout combined;
        return 204;
    }
}